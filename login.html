<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediConnect - Login</title>

    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/jpeg" href="download.jpg">
</head>

<body>

    <!-- Navbar -->

    <nav class="navbar">

        <div class="logo">MediConnect</div>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="patient-dashboard.html">Patient Dashdoard</a></li>
            <li><a href="doctors.html">Doctors</a></li>
            <li><a href="appointment.html">Appointment</a></li>
            <li><a href="login.html">Login</a></li>
            <li><a href="register.html">Register</a></li>
            <li><a href="help.html">Help</a></li>
        </ul>

    </nav>

    <!-- Login -->

    <section class="login-section">

        <div class="login-left">

            <h1>Welcome Back!</h1>

            <p>
                Login to continue booking appointments,
                view prescriptions and manage your health records.
            </p>

            <img src="images.jpg" alt="Doctor">

        </div>

        <div class="login-card">

            <h2>Login</h2>

            <form>

                <label>Email</label>

                <input
                    type="email"
                    placeholder="Enter your Email"
                    required>

                <label>Password</label>

                <input
                    type="password"
                    placeholder="Enter your Password"
                    required>

                <button type="submit">
                    Login
                </button>

            </form>

            <p class="register-link">
                Don't have an account?
                <a href="register.html">Register</a>
            </p>

        </div>

    </section>

</body>
</html>
