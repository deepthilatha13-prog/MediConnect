<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediConnect - Register</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/jpeg" href="img/download.jpg">
</head>

<body>

    <!-- Navbar -->

    <nav class="navbar">

        <div class="logo">MediConnect</div>

        <ul class="nav-links">

            <li><a href="index.html">Home</a></li>
            <li><a href="patient-dashboard.html">Patient Dashdoard</a></li>
            <li><a href="doctors.html">Doctors</a></li>
            <li><a href="appointment.html">Appointment</a></li>
            <li><a href="login.html">Login</a></li>
            <li><a href="register.html">Register</a></li>
            <li><a href="help.html">Help</a></li>
        </ul>

    </nav>

    <!-- Register Section -->

    <section class="login-section">

        <div class="login-left">

            <h1>Create Account</h1>

            <p>
                Register now to book appointments,
                consult doctors, and manage your healthcare
                services easily.
            </p>

            <img src="img/images.jpg" alt="Doctor">

        </div>

        <div class="login-card">

            <h2>Register</h2>

            <form>

                <label>Full Name</label>

                <input
                    type="text"
                    placeholder="Enter your Full Name"
                    required>

                <label>Email</label>

                <input
                    type="email"
                    placeholder="Enter your Email"
                    required>

                <label>Phone Number</label>

                <input
                    type="tel"
                    placeholder="Enter your Phone Number"
                    required>

                <label>Password</label>

                <input
                    type="password"
                    placeholder="Create Password"
                    required>

                <label>Confirm Password</label>

                <input
                    type="password"
                    placeholder="Confirm Password"
                    required>

                <button type="submit">

                    Register

                </button>

            </form>

            <p class="register-link">

                Already have an account?

                <a href="login.html">Login</a>

            </p>

        </div>

    </section>

    <footer>

        © 2026 MediConnect | All Rights Reserved

    </footer>

</body>
</html>
