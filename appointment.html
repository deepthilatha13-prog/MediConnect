<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediConnect - Appointment</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/jpeg" href="img/download.jpg"></head>

<body>

    <!-- Navbar -->

    <nav class="navbar">

        <div class="logo">MediConnect</div>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="patient-dashboard.html">Patient Dashdoard</a></li>
            <li><a href="doctors.html">Doctors</a></li>
            <li><a href="appointment.html">Appointment</a></li>
            <li><a href="login.html">Login</a></li>
            <li><a href="register.html">Register</a></li>
            <li><a href="help.html">Help</a></li>
        </ul>

    </nav>

    <!-- Appointment Section -->

    <section class="main-container">

        <div class="left-side-style">

            <h1>Book Appointment</h1>

            <h3>Your Health, Our Priority</h3>

            <p>
                Fill in your details to schedule an appointment
                with your preferred doctor.
            </p>

            <img src="img/images.jpg" alt="Doctor" width="300">

        </div>

        <div class="login-card">

            <h2>Appointment Form</h2>

            <form>

                <label>Patient Name</label>

                <input
                type="text"
                placeholder="Enter your Name"
                required>

                <label>Email</label>

                <input
                type="email"
                placeholder="Enter your Email"
                required>

                <label>Phone Number</label>

                <input
                type="tel"
                placeholder="Enter your Phone Number"
                required>

                <label>Select Doctor</label>

                <select required>

                    <option>Select Doctor</option>

                    <option>Dr. Priya Sharma</option>

                    <option>Dr. Rahul Kumar</option>

                    <option>Dr. Anitha Rao</option>

                </select>

                <label>Appointment Date</label>

                <input
                type="date"
                required>

                <label>Appointment Time</label>

                <input
                type="time"
                required>

                <label>Symptoms</label>

                <textarea
                rows="4"
                placeholder="Describe your symptoms"></textarea>

                <button type="submit">

                    Confirm Appointment

                </button>

            </form>

        </div>

    </section>

    <footer>

        © 2026 MediConnect | All Rights Reserved

    </footer>

</body>
</html>
